# Step 6.7 (D-025): run the CPU test suite on every push.
# No GPU runners are free, so CUDA tests skip here; GPU numbers live in runs/bench/*.json.
# Data (data/*.bin) and TinyLlama weights (HF cache) are not in the repo; their tests skip too.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true

      # pyproject.toml takes torch from the CUDA 13.0 index (D-017), which pulls several GB of
      # CUDA libraries a CPU runner can't use. Install the CPU build of the same version first;
      # the project install then finds torch==2.14.1 already satisfied.
      - name: Install (CPU torch)
        run: |
          uv venv
          uv pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          uv pip install -e . --group dev
          if uv pip list | grep -qi '^nvidia-'; then echo "CUDA libraries were installed"; exit 1; fi
          uv run --no-sync python -c "import torch; print(torch.__version__, 'cuda', torch.cuda.is_available())"

      - name: Test
        run: uv run --no-sync pytest -q -rs

  # 6.5b (D-028 amendment): build the Space's Docker image (CPU only, D-033), serve a tiny random
  # model in the 4.8b export format, and smoke-check it with the same script used on the Space.
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: docker build -t tinyllm:ci --build-arg GIT_COMMIT=${GITHUB_SHA::7} .

      - name: Tiny random model (made inside the image)
        run: |
          mkdir -m 777 tiny
          docker run --rm -v "$PWD/scripts:/scripts:ro" -v "$PWD/tiny:/out" \
            --entrypoint python tinyllm:ci /scripts/make_tiny_hf_model.py --out /out/model

      - name: Serve and smoke-check (/health, /ready, a completion, /stats norm_backend torch)
        run: |
          docker run -d --name tinyllm -p 7860:7860 -v "$PWD/tiny/model:/model:ro" -e MODEL=/model tinyllm:ci
          python3 scripts/smoke_server.py --url http://127.0.0.1:7860 --wait 120 --norm-backend torch

      - name: Graceful stop (SIGTERM → drain → exit 0)
        run: |
          docker stop -t 30 tinyllm
          test "$(docker inspect -f '{{.State.ExitCode}}' tinyllm)" = 0

      - name: Server log
        if: always()
        run: docker logs tinyllm 2>&1 | tail -n 40 || true
