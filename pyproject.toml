[project]
name = "tinyllm"
version = "0.1.0"
description = "A small Llama-style LLM built from scratch: training, inference engine, attention research"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.14.1",
    "numpy",
    "datasets>=5.1.0",
    "tokenizers>=0.23.3",
]

[dependency-groups]
dev = ["pytest"]

# Makes `src/tinyllm` an installed (editable) package, so scripts and tests can `import tinyllm`.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tinyllm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# PyTorch CUDA 13.0 wheels (D-017). Only torch comes from this index.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
